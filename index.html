</style></head><body><main class="wrap"><header class="top"><div><div class="brand">HERO NAME QUIZ</div><h1 class="title">#コンパス ヒーロー名クイズ</h1><div class="sub">ゲーム内表記で答えよう。ひらがな・カタカナも判定。</div></div><div class="badge">オリジナル ＋ コラボ</div></header>
<div class="toolbar"><select id="mode" class="select"><option value="all">全ヒーロー</option><option value="original">オリジナルのみ</option><option value="collab">コラボのみ</option></select><button id="hint" class="btn">ヒントを表示</button><button id="skip" class="btn">答えを見る</button><button id="next" class="btn primary">次へ →</button><div id="stats" class="stats"></div></div>
<section class="card"><div class="row"><div id="portrait" class="portrait"><span>?</span></div><div class="info"><div id="number" class="number"></div><div id="hintText" class="hint">このヒーローは誰？</div><div><span id="origin" class="pill"></span><span id="role" class="pill"></span></div><div class="prompt">ヒーロー名を入力</div></div></div><form id="form" class="form"><input id="answer" class="input" autocomplete="off" placeholder="例：十文字 アタリ" aria-label="ヒーロー名"><button class="btn primary" type="submit">回答</button></form><div id="feedback" class="feedback" aria-live="polite"></div><div class="progress"><i id="progress"></i></div><div class="footer"><span id="counter"></span><span>実装順</span></div></section>
<section class="list"><div class="listhead"><div class="listtitle">今回の回答</div><div id="score"></div></div><div id="items" class="items"></div></section><p class="sub" style="text-align:center;margin-top:20px">ヒントはオリジナル／コラボとロールを表示。</p></main>
<script>
const heroes=[["2016","十文字 アタリ","スプリンター","オリジナル","アタリ"],["2016","ジャスティス ハンコック","タンク","オリジナル","ジャスティス"],["2016","リリカ","ガンナー","オリジナル",""],["2016","双挽 乃保","アタッカー","オリジナル","乃保"],["2016","桜華 忠臣","アタッカー","オリジナル","忠臣"],["2016","ジャンヌ ダルク","タンク","オリジナル","ジャンヌ"],["2016","マルコス'55","アタッカー","オリジナル","マルコス"],["2016","ルチアーノ","ガンナー","オリジナル",""],["2016","Voidoll","スプリンター","オリジナル","ボイドール"],["2016","深川 まとい","ガンナー","オリジナル","まとい"],["2017","ソル＝バッドガイ","アタッカー","コラボ","ソル"],["2017","ディズィー","ガンナー","コラボ",""],["2017","グスタフ ハイドリヒ","タンク","オリジナル","グスタフ"],["2017","ニコラ テスラ","スプリンター","オリジナル","テスラ"],["2017","初音 ミク","スプリンター","コラボ","初音ミク"],["2017","ヴィオレッタ ノワール","タンク","オリジナル","ヴィオレッタ"],["2017","コクリコット ブランシュ","スプリンター","オリジナル","コクリコ"],["2017","リュウ","アタッカー","コラボ",""],["2017","春麗","スプリンター","コラボ",""],["2017","マリア=S=レオンブルク","ガンナー","オリジナル","マリア"],["2017","アダム=ユーリエフ","アタッカー","オリジナル","アダム"],["2017","13 †サーティーン†","ガンナー","オリジナル","サーティーン"],["2017","かけだし勇者","スプリンター","オリジナル","勇者"],["2017","エミリア","ガンナー","コラボ",""],["2017","レム","アタッカー","コラボ",""],["2018","カイ＝キスク","アタッカー","コラボ","カイ"],["2018","メグメグ","ガンナー","オリジナル",""],["2018","鏡音 リン","ガンナー","コラボ","鏡音リン"],["2018","鏡音 レン","タンク","コラボ","鏡音レン"],["2018","イスタカ","ガンナー","オリジナル",""],["2018","ザック＆レイチェル","スプリンター","コラボ","ザックとレイチェル"],["2018","輝龍院 きらら","スプリンター","オリジナル","きらら"],["2018","モノクマ","タンク","コラボ",""],["2018","ヴィーナス ポロロッチョ","アタッカー","オリジナル","ポロロッチョ"],["2018","アクア","スプリンター","コラボ",""],["2018","めぐみん","タンク","コラボ",""],["2019","ソーン=ユーリエフ","ガンナー","オリジナル","ソーン"],["2019","リヴァイ","アタッカー","コラボ",""],["2019","デビルミント鬼龍 デルミン","アタッカー","オリジナル","デルミン"],["2019","トマス","タンク","オリジナル",""],["2019","猫宮 ひなた","ガンナー","コラボ","猫宮ひなた"],["2019","岡部 倫太郎","ガンナー","コラボ","岡部倫太郎"],["2019","零夜","スプリンター","オリジナル",""],["2019","セイバーオルタ","アタッカー","コラボ",""],["2019","ギルガメッシュ","ガンナー","コラボ",""],["2020","ルルカ","アタッカー","オリジナル",""],["2020","ピエール 77世","スプリンター","オリジナル","ピエール"],["2020","佐藤四郎兵衛忠信","タンク","オリジナル","忠信"],["2020","アイズ・ヴァレンシュタイン","アタッカー","コラボ","アイズ"],["2020","狐ヶ咲 甘色","アタッカー","オリジナル","甘色"],["2020","ノクティス","アタッカー","コラボ","ノクト"],["2020","HM-WA100 ニーズヘッグ","ガンナー","オリジナル","ニーズヘッグ"],["2021","中島 敦","アタッカー","コラボ","中島敦"],["2021","芥川 龍之介","ガンナー","コラボ","芥川龍之介"],["2021","ゲームバズーカガール","ガンナー","オリジナル","バズーカガール"],["2021","ライザリン・シュタウト","タンク","コラボ","ライザ"],["2021","青春 アリス","タンク","オリジナル","アリス"],["2021","ジョーカー","スプリンター","コラボ",""],["2021","イグニス=ウィル=ウィスプ","アタッカー","オリジナル","イグニス"],["2021","アインズ・ウール・ゴウン","ガンナー","コラボ","アインズ"],["2021","糸廻 輪廻","ガンナー","オリジナル","輪廻"],["2021","キリト","アタッカー","コラボ",""],["2021","アスナ","スプリンター","コラボ",""],["2022","Bugdoll","ガンナー","オリジナル","バグドール"],["2022","ステリア・ララ・シルワ","アタッカー","オリジナル","ステリア"],["2022","ラム","スプリンター","コラボ",""],["2022","2B","アタッカー","コラボ","2b"],["2022","ラヴィ・シュシュマルシュ","タンク","オリジナル","ラヴィ"],["2022","リムル=テンペスト","アタッカー","コラボ","リムル"],["2022","アル・ダハブ=アルカティア","スプリンター","オリジナル","アルダハブ"],["2022","御坂 美琴","アタッカー","コラボ","御坂美琴"],["2022","アクセラレータ","ガンナー","コラボ","一方通行"],["2023","天空王 ぶれいずどらごん","ガンナー","オリジナル","ぶれいずどらごん"],["2023","ベル・クラネル","スプリンター","コラボ","ベル"],["2023","ロキシー・ミグルディア","ガンナー","コラボ","ロキシー"],["2023","某＜なにがし＞","スプリンター","オリジナル","なにがし"],["2023","ロックマン.EXE＆光熱斗","ガンナー","コラボ","ロックマンエグゼと光熱斗"],["2023","クー・シー","アタッカー","オリジナル",""],["2023","デンジ","アタッカー","コラボ",""],["2023","パワー","ガンナー","コラボ",""],["2024","アミスター=バランディン","タンク","オリジナル","アミスター"],["2024","シノン","ガンナー","コラボ",""],["2024","ターニャ・デグレチャフ","アタッカー","コラボ","ターニャ"],["2024","鬼ヶ式 うら","タンク","オリジナル","うら"],["2024","コラプス","アタッカー","オリジナル",""],["2024","ボンドルド","アタッカー","コラボ",""],["2024","みりぽゆ","ガンナー","オリジナル",""],["2024","ゴン","アタッカー","コラボ",""],["2024","キルア","スプリンター","コラボ",""],["2025","チーちゃん","スプリンター","オリジナル",""],["2025","上条 当麻","アタッカー","コラボ","上条当麻"],["2025","ーペルリニエ","ガンナー","オリジナル","ペルリニエ"],["2025","シャドウ","アタッカー","コラボ",""],["2025","ポプ子＆ピピ美","タンク","コラボ","ポプ子とピピ美"],["2025","メルーニャ・ランチェルナ","ガンナー","オリジナル","メルーニャ"],["2025","セイバー","アタッカー","コラボ",""],["2025","アーチャー","アタッカー","コラボ",""],["2025","ランサー","ガンナー","コラボ",""],["2026","†ファースト†","タンク","オリジナル","ファースト"],["2026","レゼ","ガンナー","コラボ",""],["2026","シャルル・リヒター","アタッカー","オリジナル","シャルル"],["2026","一姫","ガンナー","オリジナル",""],["2026","エドワード・エルリック","タンク const norm=s=>s.toLowerCase().normalize('NFKC').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).replace(/[\s　・＝=＝'’"「」『』＆&＋+†<>＜＞＿_\-ー]/g,'');
let pool=[],idx=-1,done=new Set(),count=0,correct=0,shown=false;
const $=id=>document.getElementById(id);
function initials(n){return (n.replace(/[\s・＝=＆&.'’†<>＜＞]/g,'').match(/[一-龯々ぁ-んァ-ヶA-Za-z0-9]/g)||['?']).slice(0,2).join('')}
function setup(){const m=$('mode').value;pool=heroes.filter(h=>m==='all'||(m==='original'?h.origin==='オリジナル':h.origin==='コラボ'));idx=-1;done.clear();count=correct=0;nextHero()}
function nextHero(){if(!pool.length)return;idx=(idx+1)%pool.length;shown=false;$('answer').value='';$('feedback').textContent='';$('feedback').className='feedback';$('hintText').textContent='このヒーローは誰？';$('origin').textContent='';$('role').textContent='';$('portrait').innerHTML='<span>?</span>';$('number').textContent='HERO '+String(idx+1).padStart(3,'0');$('counter').textContent='全 '+pool.length+' 人';$('progress').style.width=(done.size/pool.length*100)+'%';$('answer').focus();update()}

setup();
</script></body></html>
